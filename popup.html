<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title data-i18n="appName">自定义代理</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><img src="icons/icon32.png" alt="" width="22" height="22"></div>
        <div class="brand-text">
          <h1 data-i18n="appName">自定义代理</h1>
          <p id="statusText" class="status off">未启用 · 使用系统代理</p>
        </div>
      </div>
      <div class="top-actions">
        <label class="switch" data-i18n-title="switchTitle" title="启用或停用代理">
          <input type="checkbox" id="enabled" data-i18n-aria-label="switchTitle" aria-label="启用或停用代理">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main>
      <section class="section appearance-section">
        <div class="section-head">
          <span class="section-title" data-i18n="appearanceTitle">外观</span>
        </div>
        <div class="appearance-box">
          <div class="setting-row">
            <span class="setting-label" data-i18n="langTitle">语言</span>
            <div class="seg seg-3 lang-seg" id="langGroup" role="group" data-i18n-aria-label="langTitle" aria-label="语言">
              <button type="button" class="seg-btn active" data-value="zh" aria-pressed="true">中文</button>
              <button type="button" class="seg-btn" data-value="en" aria-pressed="false">English</button>
              <button type="button" class="seg-btn" data-value="ja" aria-pressed="false">日本語</button>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <span class="section-title" data-i18n="sectionProtocol">代理协议</span>
        </div>
        <div class="seg seg-4" id="protocolGroup" role="group" data-i18n-aria-label="sectionProtocol" aria-label="代理协议">
          <button type="button" class="seg-btn active" data-value="http" aria-pressed="true">HTTP</button>
          <button type="button" class="seg-btn" data-value="https" aria-pressed="false">HTTPS</button>
          <button type="button" class="seg-btn" data-value="socks4" aria-pressed="false">SOCKS4</button>
          <button type="button" class="seg-btn" data-value="socks5" aria-pressed="false">SOCKS5</button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <span class="section-title" data-i18n="sectionScope">代理范围</span>
        </div>
        <div class="seg seg-2" id="modeGroup" role="group" data-i18n-aria-label="sectionScope" aria-label="代理范围">
          <button type="button" class="seg-btn active" data-value="all" aria-pressed="true" data-i18n="scopeAll">全部流量</button>
          <button type="button" class="seg-btn" data-value="targeted" aria-pressed="false" data-i18n="scopeTarget">仅名单</button>
        </div>
        <p id="scopeHint" class="field-hint">所有网站流量都会经过代理，可在下方添加例外。</p>
        <div class="site-quick hidden" id="siteQuickRow">
          <div class="site-info">
            <span data-i18n="siteLabel">当前页面</span>
            <span id="currentSiteDomain" class="site-domain">-</span>
          </div>
          <button id="siteToggleBtn" class="btn ghost site-btn" type="button">
            <span id="siteToggleText">加入代理</span>
          </button>
        </div>
        <details class="auth-box" id="tabDomainsPanel">
          <summary>
            <span class="section-title" data-i18n="tabDomainsTitle">当前标签页域名</span>
            <span id="tabDomainCount" class="chip">0</span>
          </summary>
          <div class="details-content">
            <div id="tabDomainList" class="domain-list" role="list"></div>
            <p class="field-hint" data-i18n="tabDomainsHint">自动记录本标签页近期加载过的域名，点击按钮即可加入或移出走代理名单。</p>
          </div>
        </details>
      </section>

      <section class="section">
        <div class="section-head">
          <span class="section-title" data-i18n="sectionServer">代理服务器</span>
        </div>
        <div class="server-row">
          <div class="field field-grow">
            <label for="host" data-i18n="hostLabel">地址（IP 或域名）</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"></circle><path d="M3.5 12h17M12 3.5c2.6 2.5 3.9 5.3 3.9 8.5s-1.3 6-3.9 8.5c-2.6-2.5-3.9-5.3-3.9-8.5s1.3-6 3.9-8.5Z" fill="none" stroke="currentColor" stroke-width="1.7"></path></svg>
              </span>
              <input type="text" id="host" data-i18n-placeholder="hostPlaceholder" placeholder="127.0.0.1 或 proxy.example.com" autocomplete="off" spellcheck="false">
            </div>
          </div>
          <div class="field field-port">
            <label for="port" data-i18n="portLabel">端口</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"></rect><path d="M8 9.5h8M8 14.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
              </span>
              <input type="number" id="port" min="1" max="65535" data-i18n-placeholder="portPlaceholder" placeholder="8080" inputmode="numeric">
            </div>
          </div>
        </div>
        <div class="test-row">
          <button id="testBtn" class="btn ghost test-btn" type="button">
            <span data-i18n="testButton">测试连接</span>
          </button>
          <span id="testResult" class="test-result" role="status"></span>
        </div>
      </section>

      <details class="auth-box" id="authBox">
        <summary>
          <span data-i18n="authLabel">代理认证</span>
          <span class="auth-badge" data-i18n="authOptional">可选</span>
        </summary>
        <div class="auth-fields">
          <div class="field">
            <label for="username" data-i18n="usernameLabel">用户名</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"></circle><path d="M4.5 20c1.2-3.4 4-5 7.5-5s6.3 1.6 7.5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
              </span>
              <input type="text" id="username" data-i18n-placeholder="usernamePlaceholder" placeholder="代理需要认证时填写" autocomplete="off" spellcheck="false">
            </div>
          </div>
          <div class="field">
            <label for="password" data-i18n="passwordLabel">密码</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15"><rect x="5" y="10" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
              </span>
              <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" placeholder="代理需要认证时填写" autocomplete="new-password">
            </div>
          </div>
        </div>
      </details>
      <div id="authHint" class="callout hidden" data-i18n="socksAuthHint">Chrome 原生不支持 SOCKS 代理的用户名密码认证，SOCKS 模式请留空认证信息。</div>

      <details class="auth-box" id="targetsPanel">
        <summary>
          <span class="section-title" data-i18n="targetTitle">走代理名单</span>
          <span id="targetCount" class="chip">0 条</span>
        </summary>
        <div class="details-content">
          <textarea id="targets" rows="4" data-i18n-placeholder="targetPlaceholder" placeholder="example.com&#10;*.google.com&#10;1.2.3.4&#10;10.0.0.0/8"></textarea>
          <p class="field-hint" data-i18n="targetHint">支持域名、*. 通配符、IPv4 / IPv6、IPv4 网段；example.com 与 www.example.com 互相覆盖。</p>
        </div>
      </details>

      <details class="auth-box" id="bypassPanel">
        <summary>
          <span class="section-title" data-i18n="bypassTitle">例外：不走代理</span>
        </summary>
        <div class="details-content">
          <textarea id="bypass" rows="2" data-i18n-placeholder="bypassPlaceholder" placeholder="localhost、127.0.0.1、&lt;local&gt;"></textarea>
          <p class="field-hint" data-i18n="bypassHint">多个地址用逗号或换行分隔。</p>
        </div>
      </details>

      <div id="message" class="message" role="status"></div>
    </main>

    <footer class="footer">
      <button id="disableBtn" class="btn ghost" type="button" data-i18n="disable">停用代理</button>
      <button id="saveBtn" class="btn primary" type="button">
        <span data-i18n="save">保存并应用</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
